app-id: io.github.openwallpapers.OpenWallpaper
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: openwallpaper

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=~/.config/autostart:create
  - --filesystem=~/.local/share/Steam/steamapps/workshop/content/431960:ro
  - --filesystem=~/.steam/steam/steamapps/workshop/content/431960:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam/.local/share/Steam/steamapps/workshop/content/431960:ro

modules:
  - name: openwallpaper
    buildsystem: simple
    build-commands:
      - install -d /app/lib/python3.13/site-packages
      - cp -r openwallpaper /app/lib/python3.13/site-packages/
      - install -Dm755 data/openwallpaper.sh /app/bin/openwallpaper
      - install -Dm644 data/io.github.openwallpapers.OpenWallpaper.desktop
        /app/share/applications/io.github.openwallpapers.OpenWallpaper.desktop
      - install -Dm644 data/io.github.openwallpapers.OpenWallpaper.metainfo.xml
        /app/share/metainfo/io.github.openwallpapers.OpenWallpaper.metainfo.xml
      - install -Dm644 data/io.github.openwallpapers.OpenWallpaper.svg
        /app/share/icons/hicolor/scalable/apps/io.github.openwallpapers.OpenWallpaper.svg
      - install -Dm644 data/io.github.openwallpapers.OpenWallpaper-symbolic.svg
        /app/share/icons/hicolor/symbolic/apps/io.github.openwallpapers.OpenWallpaper-symbolic.svg
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .flatpak-builder
          - build-dir
          - repo
          - __pycache__
